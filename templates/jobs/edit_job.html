```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job | JobBridge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #263445;
        }

        .navbar {
            background: #172b4d;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .form-card h1 {
            color: #172b4d;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            color: #344054;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #356ae6;
            box-shadow: 0 0 0 3px rgba(53,106,230,0.1);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 13px 24px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: #356ae6;
            color: white;
        }

        .save-btn:hover {
            background: #2454c5;
        }

        .cancel-btn {
            background: #e9edf3;
            color: #344054;
        }

        .cancel-btn:hover {
            background: #dce2eb;
        }

        @media(max-width: 600px) {
            .form-card {
                padding: 23px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>JobBridge</h2>
        <a href="{% url 'dashboard' %}">Back to Dashboard</a>
    </nav>

    <div class="container">

        <div class="form-card">

            <h1>Edit Job Posting</h1>

            <p class="subtitle">
                Update your job details and keep your posting information accurate.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Job Title</label>
                    <input
                        type="text"
                        name="title"
                        value="{{ job.title }}"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Category</label>
                        <input
                            type="text"
                            name="category"
                            value="{{ job.category }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input
                            type="text"
                            name="location"
                            value="{{ job.location }}"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Job Type</label>
                        <select name="job_type" required>
                            <option value="full_time"
                                {% if job.job_type == 'full_time' %}selected{% endif %}>
                                Full Time
                            </option>

                            <option value="part_time"
                                {% if job.job_type == 'part_time' %}selected{% endif %}>
                                Part Time
                            </option>

                            <option value="internship"
                                {% if job.job_type == 'internship' %}selected{% endif %}>
                                Internship
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Salary</label>
                        <input
                            type="text"
                            name="salary"
                            value="{{ job.salary }}"
                            placeholder="e.g. 40,000 - 60,000 PKR"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label>Job Description</label>
                    <textarea
                        name="description"
                        required
                    >{{ job.description }}</textarea>
                </div>

                <div class="form-group">
                    <label>Requirements</label>
                    <textarea
                        name="requirements"
                        required
                    >{{ job.requirements }}</textarea>
                </div>

                <div class="form-group">
                    <label>Application Deadline</label>
                    <input
                        type="date"
                        name="deadline"
                        value="{{ job.deadline|date:'Y-m-d' }}"
                    >
                </div>

                <div class="buttons">

                    <button type="submit" class="btn save-btn">
                        Save Changes
                    </button>

                    <a href="{% url 'dashboard' %}" class="btn cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
```
