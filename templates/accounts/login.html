
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobBridge - Login</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back!</h1>

            <p>Login to continue your JobBridge journey.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Login</button>
            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="{% url 'signup' %}">Create Account</a>
            </p>

            <a href="{% url 'home' %}" class="back-home">
                Back to Home
            </a>

        </div>

    </div>

</body>
</html>
