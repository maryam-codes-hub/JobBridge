{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | JobBridge</title>

    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>

<body>

    <nav class="navbar">
        <h2 class="logo">JobBridge</h2>

        <a href="{% url 'profile' %}" class="back-btn">
            Back to Profile
        </a>
    </nav>

    <main class="profile-container">

        <div class="info-section">

            <h2>Edit Your Profile</h2>

            <form method="POST">

                {% csrf_token %}

                <div class="edit-form-grid">

                    <div class="form-group">
                        <label>First Name</label>
                        <input
                            type="text"
                            name="first_name"
                            value="{{ user.first_name }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input
                            type="text"
                            name="last_name"
                            value="{{ user.last_name }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input
                            type="email"
                            name="email"
                            value="{{ user.email }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <input
                            type="text"
                            value="{{ user.username }}"
                            disabled
                        >
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="text"
                            name="phone"
                            value="{{ user_profile.phone }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input
                            type="text"
                            name="location"
                            value="{{ user_profile.location }}"
                        >
                    </div>

                </div>
                {% if user_profile.role == 'employer' %}

<div class="form-group">
    <label>Company Name</label>

    <input
        type="text"
        name="company_name"
        value="{{ user_profile.company_name }}"
    >
</div>

{% endif %}

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

            </form>

        </div>

    </main>

</body>
</html>
