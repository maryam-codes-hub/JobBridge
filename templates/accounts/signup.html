
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobBridge - Signup</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Your JobBridge Account</h1>

            <p>Join JobBridge and explore new opportunities.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Create Account</button>
            </form>

            <p class="auth-link">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

            <a href="{% url 'home' %}" class="back-home">
                Back to Home
            </a>

        </div>

    </div>

</body>
</html>
